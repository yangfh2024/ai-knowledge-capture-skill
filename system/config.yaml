protocol_version: "0.1"

knowledge_base:
  root: ""
  require_read_access: true
  require_write_access: true

value_score:
  dimensions:
    - project_progress
    - decision_formed
    - reusable_method
    - evidence_or_case
    - long_term_asset
  scale: 0-2
  ignore_below: 6

write_policy:
  approval_required: true
  conflict_mode: propose_merge
  per_chat_files: false

storage:
  mode: local
  local_git: false
  github:
    enabled: false
    remote: ""
    auto_push: false

paths:
  inbox: inbox/
  receipts: receipts/
  review_queue: system/review-queue.md
